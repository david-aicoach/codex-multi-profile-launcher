name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate package
        run: python3 tools/aosctl.py validate --verbose

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check shell syntax
        run: bash -n scripts/verify-review-runner.sh wrappers/delegate_to_codex.sh
