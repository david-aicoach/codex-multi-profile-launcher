version: 2

manager:
  id: github-controller
  name: TBHRC GitHub Controller
  runtime: authorised-agent
  source_of_truth: owning GitHub repository and controlling Issue/PR
  reusable_method: tbhrc/skills
  privileged_runtime: tbhrc/ai-engine

workers:
  - id: C1
    name: Codex Business
    runtime: codex
    codex_home: ~/.codex-business
    primary_roles:
      - implementation
      - hardening
      - integration
      - review
    max_concurrent_tasks: 1

  - id: C2
    name: Codex David
    runtime: codex
    codex_home: ~/.codex-david
    primary_roles:
      - implementation
      - prototype
      - bootstrap
      - review
    max_concurrent_tasks: 1

routing:
  selection_owner: controller
  selection_factors:
    - task_fit
    - permissions
    - availability
    - remaining_budget
  explicit_profile_required: true
  automatic_account_rotation: false
  automatic_profile_fallback: false
